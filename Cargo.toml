[package]
name = "vuuut-cli"
version = "0.1.0"
edition = "2021"
description = "Install and manage Vuuut CMS"
license = "MIT"

[[bin]]
name = "vuuut"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
